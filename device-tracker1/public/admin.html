<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الزيارات — الخاص بك فقط</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  body {
    min-height: 100vh;
    padding: 24px;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #f1f5f9;
  }
  h1 { text-align: center; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 20px; font-size: .9rem; }
  .login-box, .stats { max-width: 800px; margin: 0 auto; }
  .login-box {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 380px;
  }
  input {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.08);
    color: #f1f5f9;
    font-size: 1rem;
    outline: none;
  }
  input:focus { border-color: #38bdf8; }
  button {
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    color: #0f172a;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .error { color: #f87171; font-size: .85rem; display: none; }
  .visit-card {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .visit-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,.1);
    margin-bottom: 12px;
  }
  .visit-head .time { color: #94a3b8; font-size: .85rem; margin-left: auto; }
  .returning-badge {
    background: rgba(250,204,21,.15); color: #facc15;
    border: 1px solid rgba(250,204,21,.3);
    padding: 3px 10px; border-radius: 20px;
    font-size: .72rem; font-weight: 700;
  }
  .details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 8px;
  }
  .detail {
    background: rgba(255,255,255,.04);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .detail .label { font-size: .7rem; color: #94a3b8; }
  .detail .value { font-size: .85rem; font-weight: 600; word-break: break-word; }
  .badge {
    display: inline-block; padding: 4px 10px;
    border-radius: 20px; font-weight: 700; font-size: .78rem;
    background: rgba(56,189,248,.15); color: #38bdf8;
    border: 1px solid rgba(56,189,248,.3);
  }
  .stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
  .stat {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    padding: 14px 22px;
    text-align: center;
    min-width: 110px;
  }
  .stat .num { font-size: 1.6rem; font-weight: 800; color: #38bdf8; }
  .stat .lbl { font-size: .78rem; color: #94a3b8; }
  .cards-wrap { max-height: 65vh; overflow-y: auto; padding-right: 6px; }
  .hidden { display: none; }
  .empty { text-align: center; color: #94a3b8; padding: 30px; }
  .refresh-btn { max-width: 160px; margin: 0 auto 16px; display: block; }
  .copy-note { text-align:center; color:#64748b; font-size:.75rem; margin-top:14px; }
</style>
</head>
<body>

<h1>📊 لوحة الزيارات</h1>
<p class="subtitle">كل شخص فتح رابطك — يظهر لك نوع جهازه هنا</p>

<div class="login-box" id="loginBox">
  <label>أدخل كلمة السر الخاصة بك:</label>
  <input type="password" id="passwordInput" placeholder="كلمة السر">
  <button onclick="login()">دخول</button>
  <div class="error" id="error">❌ كلمة السر غير صحيحة</div>
</div>

<div id="dashboard" class="hidden">
  <div class="stats-row" id="statsRow"></div>
  <button class="refresh-btn" onclick="loadVisits()">🔄 تحديث</button>
  <div class="cards-wrap">
    <div id="cards"></div>
    <div class="empty hidden" id="emptyMsg">لا توجد زيارات بعد — شارك رابطك وانتظر! 📩</div>
  </div>
  <p class="copy-note">التحديث تلقائي كل 10 ثوانٍ</p>
</div>

<script>
const saved = localStorage.getItem('tracker_password');
if (saved) {
  document.getElementById('passwordInput').value = saved;
  tryLogin(saved);
}

function login() {
  const pwd = document.getElementById('passwordInput').value.trim();
  tryLogin(pwd);
}

async function tryLogin(pwd) {
  const res = await fetch('/api/visits?password=' + encodeURIComponent(pwd));
  if (res.ok) {
    localStorage.setItem('tracker_password', pwd);
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    render(await res.json());
    setInterval(loadVisits, 10000);
  } else {
    document.getElementById('error').style.display = 'block';
  }
}

async function loadVisits() {
  const pwd = localStorage.getItem('tracker_password');
  if (!pwd) return;
  const res = await fetch('/api/visits?password=' + encodeURIComponent(pwd));
  if (res.ok) render(await res.json());
}

function render(visits) {
  const cards = document.getElementById('cards');
  const emptyMsg = document.getElementById('emptyMsg');
  cards.innerHTML = '';
  emptyMsg.classList.toggle('hidden', visits.length > 0);

  // عد البصمات لمعرفة الزوار المتكررين
  const fpCounts = {};
  visits.forEach(v => {
    if (v.fingerprint) fpCounts[v.fingerprint] = (fpCounts[v.fingerprint] || 0) + 1;
  });

  const counts = { 'موبايل': 0, 'تابلت': 0, 'كمبيوتر': 0 };
  visits.forEach(v => { if (counts[v.deviceType] !== undefined) counts[v.deviceType]++; });

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${visits.length}</div><div class="lbl">إجمالي الزيارات</div></div>
    <div class="stat"><div class="num">${counts['موبايل']}</div><div class="lbl">📱 موبايل</div></div>
    <div class="stat"><div class="num">${counts['تابلت']}</div><div class="lbl">📱 تابلت</div></div>
    <div class="stat"><div class="num">${counts['كمبيوتر']}</div><div class="lbl">🖥️ كمبيوتر</div></div>
  `;

  const labels = {
    model: '📱 الموديل',
    os: '💻 النظام',
    browser: '🌐 المتصفح',
    screen: '🖼️ الشاشة',
    ram: '🧠 الرام',
    gpu: '🎮 المعالج الرسومي',
    battery: '🔋 البطارية',
    network: '📶 الشبكة',
    timezone: '🕐 المنطقة الزمنية',
    languages: '🗣️ اللغات',
    theme: '🌗 وضع العرض',
    storage: '📦 التخزين',
    openedFrom: '📲 فتح الرابط من',
    localTime: '⏱️ توقيت جهازه',
    orientation: '🔄 اتجاه الجهاز',
    referrer: '🔗 جاء من',
    ip: '📍 الـ IP',
  };

  [...visits].reverse().forEach(v => {
    const time = new Date(v.time).toLocaleString('ar-SA');
    const location = [v.country, v.city].filter(Boolean).join('، ') || 'غير معروف';
    const isReturning = v.fingerprint && fpCounts[v.fingerprint] > 1;

    const card = document.createElement('div');
    card.className = 'visit-card';

    let details = '';
    for (const [key, label] of Object.entries(labels)) {
      const val = v[key] || 'غير متاح';
      details += `<div class="detail"><div class="label">${label}</div><div class="value">${val}</div></div>`;
    }

    card.innerHTML = `
      <div class="visit-head">
        <span class="badge">${v.icon} ${v.deviceType}</span>
        <span class="badge">🌍 ${location}</span>
        ${v.isp ? `<span class="badge">📡 ${v.isp}</span>` : ''}
        ${isReturning ? '<span class="returning-badge">🔁 زائر متكرر (' + fpCounts[v.fingerprint] + ' زيارات)</span>' : ''}
        <span class="time">${time}</span>
      </div>
      <div class="details-grid">${details}</div>`;
    cards.appendChild(card);
  });
}

document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
